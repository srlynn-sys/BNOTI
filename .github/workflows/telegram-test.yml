name: Test Telegram Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Send a safe test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const chatId = process.env.TELEGRAM_CHAT_ID;

          if (!token || !chatId) {
            console.error("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret.");
            process.exit(1);
          }

          (async () => {
            const response = await fetch(`https://api.telegram.org/bot${token}/sendMessage`, {
              method: "POST",
              headers: { "content-type": "application/json" },
              body: JSON.stringify({
                chat_id: chatId,
                text: "✅ BNOTI Telegram test: message delivery is working. This is only a test; Binance Square monitoring is tested separately."
              })
            });

            const result = await response.json();
            if (!response.ok || !result.ok) {
              console.error("Telegram rejected the test message:", result.description || response.statusText);
              process.exit(1);
            }
            console.log("Telegram accepted the test message.");
          })().catch((error) => {
            console.error("Telegram test failed:", error.message);
            process.exit(1);
          });
          NODE
